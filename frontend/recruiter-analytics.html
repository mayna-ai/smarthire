<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analyses · SmartHire AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind-config.js"></script>
</head>
<body>

<div class="min-h-screen flex">
  <sh-sidebar role="recruiter" active="recruiter-analytics"></sh-sidebar>
  <main class="flex-1 min-w-0">
    <header class="bg-white border-b border-line px-6 py-5 flex items-center justify-between">
      <div>
        <h1 class="font-display text-2xl font-bold">Analyses</h1>
        <p class="text-sm text-muted mt-0.5">Performance du recrutement.</p>
      </div>
      <div class="flex gap-2">
        <button class="btn-outline text-sm">🔔</button>
        <button class="btn-primary text-sm">+ Action</button>
      </div>
    </header>
    <div class="p-6">
<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6"><div class="card p-5">
      <div class="flex items-start justify-between">
        <div><p class="text-xs uppercase tracking-wider text-muted font-medium">Offres vues</p>
        <p class="mt-2 text-3xl font-display font-bold">12 480</p>
        <p class="mt-1 text-xs text-success font-medium">+18%</p></div>
        <div class="h-10 w-10 rounded-xl bg-navy/10 text-navy flex items-center justify-center">👁</div>
      </div></div><div class="card p-5">
      <div class="flex items-start justify-between">
        <div><p class="text-xs uppercase tracking-wider text-muted font-medium">Taux postulation</p>
        <p class="mt-2 text-3xl font-display font-bold">8.4%</p>
        <p class="mt-1 text-xs text-success font-medium">+1.2pt</p></div>
        <div class="h-10 w-10 rounded-xl bg-gold/10 text-gold flex items-center justify-center">📈</div>
      </div></div><div class="card p-5">
      <div class="flex items-start justify-between">
        <div><p class="text-xs uppercase tracking-wider text-muted font-medium">Délai moyen</p>
        <p class="mt-2 text-3xl font-display font-bold">14 jours</p>
        <p class="mt-1 text-xs text-success font-medium">-3j</p></div>
        <div class="h-10 w-10 rounded-xl bg-success/10 text-success flex items-center justify-center">⏱</div>
      </div></div><div class="card p-5">
      <div class="flex items-start justify-between">
        <div><p class="text-xs uppercase tracking-wider text-muted font-medium">Coût/embauche</p>
        <p class="mt-2 text-3xl font-display font-bold">2 140 €</p>
        <p class="mt-1 text-xs text-success font-medium">-12%</p></div>
        <div class="h-10 w-10 rounded-xl bg-navy/10 text-navy flex items-center justify-center">💰</div>
      </div></div></div>
<div class="grid lg:grid-cols-2 gap-5">
  <div class="card p-6"><h3 class="font-display font-semibold mb-2">Candidatures sur 30 jours</h3>
    <svg viewBox="0 0 400 150" class="w-full h-40"><polyline fill="none" stroke="#D4AF37" stroke-width="3" points="0,120 40,100 80,110 120,80 160,90 200,60 240,70 280,40 320,55 360,30 400,20"/><polyline fill="rgba(212,175,55,0.15)" stroke="none" points="0,120 40,100 80,110 120,80 160,90 200,60 240,70 280,40 320,55 360,30 400,20 400,150 0,150"/></svg></div>
  <div class="card p-6"><h3 class="font-display font-semibold mb-4">Répartition par source</h3>
    <ul class="space-y-3 text-sm"><li><div class="flex justify-between mb-1"><span>Recommandations IA</span><span class="font-semibold">42%</span></div><div class="h-2 bg-slate-200 rounded-full overflow-hidden"><div class="h-full bg-navy" style="width:42%"></div></div></li><li><div class="flex justify-between mb-1"><span>LinkedIn</span><span class="font-semibold">28%</span></div><div class="h-2 bg-slate-200 rounded-full overflow-hidden"><div class="h-full bg-navy" style="width:28%"></div></div></li><li><div class="flex justify-between mb-1"><span>Site carrière</span><span class="font-semibold">18%</span></div><div class="h-2 bg-slate-200 rounded-full overflow-hidden"><div class="h-full bg-navy" style="width:18%"></div></div></li><li><div class="flex justify-between mb-1"><span>Autres</span><span class="font-semibold">12%</span></div><div class="h-2 bg-slate-200 rounded-full overflow-hidden"><div class="h-full bg-navy" style="width:12%"></div></div></li></ul></div>
</div></div>
  </main>
</div><script src="components/sh-sidebar.js"></script>
</body></html>
