<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paramètres candidat · SmartHire AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind-config.js"></script>
</head>
<body>

<div class="min-h-screen flex">
  <sh-sidebar role="candidate" active="candidate-settings"></sh-sidebar>
  <main class="flex-1 min-w-0">
    <header class="bg-white border-b border-line px-6 py-5 flex items-center justify-between">
      <div>
        <h1 class="font-display text-2xl font-bold">Paramètres</h1>
        <p class="text-sm text-muted mt-0.5">Gérez votre compte et notifications.</p>
      </div>
      <div class="flex gap-2">
        <button class="btn-outline text-sm">🔔</button>
        <button class="btn-primary text-sm">+ Action</button>
      </div>
    </header>
    <div class="p-6">
<div class="max-w-3xl space-y-5">
  <div class="card p-6">
    <h3 class="font-display font-semibold mb-4">Compte</h3>
    <div class="space-y-3"><div><label class="text-sm font-medium">Email</label><input class="input mt-1" value="jane@example.com"></div>
    <div><label class="text-sm font-medium">Nouveau mot de passe</label><input class="input mt-1" type="password"></div></div>
  </div>
  <div class="card p-6">
    <h3 class="font-display font-semibold mb-4">Préférences de notifications</h3>
    <label class="flex items-center justify-between py-2"><span>Emails d'alerte offres</span><input type="checkbox" checked></label>
    <label class="flex items-center justify-between py-2"><span>Messages recruteurs</span><input type="checkbox" checked></label>
    <label class="flex items-center justify-between py-2"><span>Newsletter</span><input type="checkbox"></label>
  </div>
  <div class="flex justify-end gap-2"><button class="btn-outline">Annuler</button><button class="btn-primary">Enregistrer</button></div>
</div></div>
  </main>
</div><script src="components/sh-sidebar.js"></script>
</body></html>
