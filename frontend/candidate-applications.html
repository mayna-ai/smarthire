<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Candidatures · SmartHire AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/tailwind-config.js"></script>
</head>
<body>

<div class="min-h-screen flex">
  <sh-sidebar role="candidate" active="candidate-applications"></sh-sidebar>
  <main class="flex-1 min-w-0">
    <header class="bg-white border-b border-line px-6 py-5 flex items-center justify-between">
      <div>
        <h1 class="font-display text-2xl font-bold">Mes candidatures</h1>
        <p class="text-sm text-muted mt-0.5">Suivez l'état de vos postulations.</p>
      </div>
      <div class="flex gap-2">
        <button class="btn-outline text-sm">🔔</button>
        <button class="btn-primary text-sm">+ Action</button>
      </div>
    </header>
    <div class="p-6">
<div class="card overflow-hidden">
  <table class="w-full">
    <thead class="bg-slate-50 border-b border-line text-xs uppercase tracking-wider text-muted">
      <tr><th class="px-5 py-3 text-left">Poste</th><th class="px-5 py-3 text-left">Entreprise</th><th class="px-5 py-3 text-left">Statut</th><th class="px-5 py-3 text-left">Score</th><th class="px-5 py-3 text-left">Date</th></tr>
    </thead>
    <tbody class="divide-y divide-line text-sm">
      <tr class="hover:bg-slate-50">
        <td class="px-5 py-4 font-semibold">Senior Frontend</td>
        <td class="px-5 py-4">Northwind</td>
        <td class="px-5 py-4"><span class="badge bg-warning/15 text-warning">En revue</span></td>
        <td class="px-5 py-4 font-medium">94%</td>
        <td class="px-5 py-4 text-muted">il y a 2j</td>
      </tr>
      <tr class="hover:bg-slate-50">
        <td class="px-5 py-4 font-semibold">Product Designer</td>
        <td class="px-5 py-4">Lumen</td>
        <td class="px-5 py-4"><span class="badge bg-success/15 text-success">Entretien</span></td>
        <td class="px-5 py-4 font-medium">91%</td>
        <td class="px-5 py-4 text-muted">il y a 5j</td>
      </tr>
      <tr class="hover:bg-slate-50">
        <td class="px-5 py-4 font-semibold">Full-Stack Dev</td>
        <td class="px-5 py-4">Helix</td>
        <td class="px-5 py-4"><span class="badge bg-danger/15 text-danger">Refusée</span></td>
        <td class="px-5 py-4 font-medium">72%</td>
        <td class="px-5 py-4 text-muted">il y a 10j</td>
      </tr>
      <tr class="hover:bg-slate-50">
        <td class="px-5 py-4 font-semibold">UX Researcher</td>
        <td class="px-5 py-4">Orbit</td>
        <td class="px-5 py-4"><span class="badge bg-navy/10 text-navy">Envoyée</span></td>
        <td class="px-5 py-4 font-medium">83%</td>
        <td class="px-5 py-4 text-muted">hier</td>
      </tr>
    </tbody>
  </table>
</div></div>
  </main>
</div><script src="components/sh-sidebar.js"></script>
</body></html>
